<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheap Flights</title>
<meta name="description" content="Cheapest Ryanair round trips from the airports around Ljubljana.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #fff; --ink: #1d1b18; --muted: #77716a; --line: #eceae6; --hover: #f7f5f2; --price: #c2410c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --ink: #ece8e1; --muted: #9a958c; --line: #2a2e36; --hover: #1f2228; --price: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --ink: #ece8e1; --muted: #9a958c; --line: #2a2e36; --hover: #1f2228; --price: #fb923c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
#status { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; }
a {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 8px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
}
a:hover { background: var(--hover); }
a:focus-visible { outline: 2px solid var(--price); outline-offset: -2px; }
.route { font-weight: 600; }
.when { font-size: 14px; color: var(--muted); }
.price { font-weight: 700; font-size: 18px; color: var(--price); white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>✈️ Cheap flights from Slovenia</h1>
  <p id="status">Loading…</p>
  <ul id="list"></ul>
</main>
<script>
const fmt = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short" });
const day = (iso) => fmt.format(new Date(iso + "T12:00:00"));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function ago(date) {
  const min = Math.round((Date.now() - date) / 60000);
  if (min < 60) return `${Math.max(min, 1)} min ago`;
  const h = Math.round(min / 60);
  return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}

fetch("deals.json", { cache: "no-store" })
  .then((r) => r.ok ? r.json() : Promise.reject())
  .then((data) => {
    const names = Object.fromEntries(data.origins.map((o) => [o.code, o.name]));
    // Cheapest trip per destination, only the real deals.
    const deals = data.destinations
      .map((d) => ({ d, f: d.fares[0] }))
      .filter(({ f }) => f.price <= data.priceMax);

    const hours = (Date.now() - new Date(data.updated)) / 3600e3;
    document.getElementById("status").textContent =
      `Return, per person · updated ${ago(new Date(data.updated))}` +
      (hours > 8 ? " · may be out of date" : "");

    document.getElementById("list").innerHTML = deals.map(({ d, f }) => `
      <li><a href="${esc(f.url)}" target="_blank" rel="noopener">
        <span>
          <span class="route">${esc(names[f.from] || f.from)} → ${esc(d.city)}</span><br>
          <span class="when">${day(f.out)} – ${day(f.back)} · ${f.nights} nights</span>
        </span>
        <span class="price">€${Math.round(f.price)}</span>
      </a></li>`).join("") || "<li>No deals right now.</li>";
  })
  .catch(() => { document.getElementById("status").textContent = "Couldn't load fares. Try again in a minute."; });
</script>
</body>
</html>
