<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheap Flights</title>
<meta name="description" content="Cheapest round trips from Ljubljana and the airports around it.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #fff; --ink: #1d1b18; --muted: #77716a; --line: #eceae6; --hover: #f7f5f2; --price: #c2410c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --ink: #ece8e1; --muted: #9a958c; --line: #2a2e36; --hover: #1f2228; --price: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --ink: #ece8e1; --muted: #9a958c; --line: #2a2e36; --hover: #1f2228; --price: #fb923c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
#status { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; }
#list a {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 8px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
}
#list a:hover { background: var(--hover); }
#list a:focus-visible { outline: 2px solid var(--price); outline-offset: -2px; }
#list li.none { padding: 24px 8px; color: var(--muted); }
.route { font-weight: 600; }
.country { font-weight: 400; }
.when { font-size: 14px; color: var(--muted); }
.price { font-weight: 700; font-size: 18px; color: var(--price); white-space: nowrap; font-variant-numeric: tabular-nums; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#toggle {
  position: relative; flex: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); display: grid; place-items: center;
}
#toggle:hover, #toggle[aria-expanded="true"] { background: var(--hover); }
#toggle:focus-visible, .chips button:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--price); outline-offset: 2px; }
/* A dot on the icon, so hidden filters never silently hide deals. */
#toggle.active::after {
  content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--price);
}
#filters { margin: 0 0 16px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 16px; }
#filters[hidden] { display: none; }
.label { font-size: 13px; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; }
.label b { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; margin: 0; accent-color: var(--price); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>✈️ Cheap flights from Slovenia</h1>
      <p id="status">Loading…</p>
    </div>
    <button id="toggle" aria-label="Filters" title="Filters" aria-expanded="false" aria-controls="filters">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
  </div>

  <div id="filters" hidden>
    <div>
      <p class="label"><span>Max price per person</span><b id="maxOut"></b></p>
      <input id="max" type="range" min="30" step="5" aria-label="Max price per person">
    </div>
    <div>
      <p class="label"><span>Trip length</span></p>
      <div class="chips" id="nights">
        <button data-v="">Any</button>
        <button data-v="2-3">2–3 nights</button>
        <button data-v="4-6">4–6 nights</button>
        <button data-v="7-99">7+ nights</button>
      </div>
    </div>
  </div>

  <ul id="list"></ul>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short" });
const day = (iso) => fmt.format(new Date(iso + "T12:00:00"));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const KEY = "flights-filters";
let data, origins, max, nights;

// "it" -> 🇮🇹, built from the two regional-indicator letters.
const flag = (cc) => /^[a-z]{2}$/i.test(cc || "")
  ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1f1a5 + c.charCodeAt(0))) + " " : "";
const place = (city, country) => esc(city) +
  (country && country !== city ? `<span class="country">, ${esc(country)}</span>` : "");

function ago(date) {
  const min = Math.round((Date.now() - date) / 60000);
  if (min < 60) return `${Math.max(min, 1)} min ago`;
  const h = Math.round(min / 60);
  return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ max, nights })); } catch {}
}

function render() {
  const [lo, hi] = nights ? nights.split("-").map(Number) : [0, Infinity];
  // Cheapest matching trip per destination; fares arrive sorted cheapest first.
  const deals = data.destinations
    .map((d) => ({ d, f: d.fares.find((f) => f.price <= max && f.nights >= lo && f.nights <= hi) }))
    .filter(({ f }) => f)
    .sort((a, b) => a.f.price - b.f.price || a.f.out.localeCompare(b.f.out));

  $("maxOut").textContent = `€${max}`;
  for (const b of $("nights").children) b.setAttribute("aria-pressed", b.dataset.v === nights);
  $("toggle").classList.toggle("active", max !== data.priceMax || nights !== "");

  $("list").innerHTML = deals.map(({ d, f }) => `
    <li><a href="${esc(f.url)}" target="_blank" rel="noopener">
      <span>
        <span class="route">${flag(origins[f.from]?.cc)}${esc(origins[f.from]?.name || f.from)} →${flag(d.cc)}${place(d.city, d.country)}</span><br>
        <span class="when">${day(f.out)} – ${day(f.back)} · ${f.nights} nights${f.airline ? ` · ${esc(f.airline)}` : ""}</span>
      </span>
      <span class="price">€${Math.round(f.price)}</span>
    </a></li>`).join("") || `<li class="none">No deals match. Try a higher price or another trip length.</li>`;
}

fetch("deals.json", { cache: "no-store" })
  .then((r) => r.ok ? r.json() : Promise.reject())
  .then((d) => {
    data = d;
    origins = Object.fromEntries(data.origins.map((o) => [o.code, o]));

    const top = Math.max(...data.destinations.map((x) => x.fares.at(-1).price));
    const slider = $("max");
    slider.max = Math.max(data.priceMax, Math.ceil(top / 5) * 5);

    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    max = Math.min(Number(saved.max) || data.priceMax, +slider.max);
    nights = typeof saved.nights === "string" ? saved.nights : "";
    slider.value = max;

    slider.addEventListener("input", () => { max = +slider.value; render(); save(); });
    $("nights").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      nights = b.dataset.v; render(); save();
    });
    $("toggle").addEventListener("click", () => {
      const open = $("filters").hidden;
      $("filters").hidden = !open;
      $("toggle").setAttribute("aria-expanded", open);
    });

    const hours = (Date.now() - new Date(data.updated)) / 3600e3;
    $("status").textContent = `Return, per person · updated ${ago(new Date(data.updated))}` +
      (hours > 8 ? " · may be out of date" : "");
    render();
  })
  .catch(() => { $("status").textContent = "Couldn't load fares. Try again in a minute."; });
</script>
</body>
</html>
